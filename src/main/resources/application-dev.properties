# Local dev only. Migrations and synthetic seed are explicit: .\dev.ps1 setup.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
ctsv.auth.enabled=true
ctsv.auth.bootstrap-enabled=false
ctsv.foundation.enabled=true
foundation.units.enabled=false
foundation.resources.enabled=false
slice-a.enabled=false
spring.datasource.hikari.data-source-properties.connectRetryCount=0
spring.datasource.hikari.initialization-fail-timeout=5000
